version: 2

models:

  - name: int_orders_enriched
    description: >
      Intermediate model that joins orders with customer and nation data.
      Adds derived temporal fields such as year, month, and quarter.

    columns:
      - name: order_id
        description: Unique identifier for each order

      - name: customer_id
        description: Identifier linking order to customer

      - name: order_status_code
        description: Status of the order

      - name: nation_name
        description: Name of the customer's nation

      - name: order_year
        description: Year in which the order was placed

      - name: order_month
        description: Month in which the order was placed

      - name: order_quarter
        description: Quarter in which the order was placed
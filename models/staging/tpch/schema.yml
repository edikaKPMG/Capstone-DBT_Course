version: 2

models:

  - name: stg_tpch__orders
    description: >
      Staging model for TPCH orders data. Renames columns, standardizes naming conventions,
      and prepares order-level data for downstream transformations.

    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier linking the order to a customer

      - name: order_status_code
        description: Status of the order (O = Open, F = Filled, P = Pending)
        tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']


  - name: stg_tpch__lineitems
    description: >
      Staging model for TPCH line items. Includes calculated pricing metrics such as
      net price and gross price.

